<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>过片 · 操作逻辑原型</title>
<style>
:root{
  --bg:#0b0c0e; --canvas:#0f1113; --surface:#15181c; --surface2:#1b1f24;
  --line:#272c33; --ink:#e6e8eb; --ink2:#a8aeb8; --ink3:#6b7280;
  --accent:#39c2d7; --keep:#3fb950; --reject:#f85149; --mark:#e3b341;
  --on-solid:#fff; --on-mark:#191200;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ── 顶部 ── */
.top{
  height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.brand{font-weight:700;font-size:14px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{
  padding:5px 14px;border-radius:7px;border:1px solid transparent;
  background:transparent;color:var(--ink2);font-size:12.5px;
}
.tab.on{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.sp{flex:1}
.hint{font-size:11.5px;color:var(--ink3)}

/* ── 单图 ── */
#single{position:absolute;inset:44px 0 56px 0;display:flex;align-items:center;justify-content:center}
#single.hidden,#multi.hidden{display:none}
.cardWrap{position:relative;width:min(62vw,720px);aspect-ratio:3/2;
  transition:transform .18s ease;will-change:transform}
.card{
  position:absolute;inset:0;border-radius:12px;overflow:hidden;
  box-shadow:0 28px 70px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  font:600 64px/1 ui-monospace,Consolas,monospace;color:rgba(255,255,255,.85);
  user-select:none;cursor:grab;
}
.card:active{cursor:grabbing}
.card .badge{
  position:absolute;left:14px;top:12px;font:600 11px/1 inherit;
  padding:5px 11px;border-radius:999px;
}
.cardWrap.flyKeep{transform:translateX(70%) rotate(14deg);opacity:0}
.cardWrap.flyReject{transform:translateX(-70%) rotate(-14deg);opacity:0}
.cardWrap.flyMark{transform:translateY(-40%) scale(.94);opacity:0}

/* ── 多图 ── */
#multi{position:absolute;inset:44px 0 56px 0;display:flex;flex-direction:column}
.mHead{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--line);
}
.mHead b{font:600 13px ui-monospace,Consolas,monospace}
.mBody{
  flex:1;min-height:0;display:grid;gap:12px;padding:18px;
  justify-content:center;align-content:center;
}
.tile{
  position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
  border:2px solid var(--line);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font:600 30px/1 ui-monospace,Consolas,monospace;color:rgba(255,255,255,.7);
  transition:transform .12s ease,border-color .12s ease,opacity .12s ease;
}
.tile:hover{transform:translateY(-2px)}
.tile.unmarked{opacity:.86}
.tile.unmarked:hover{opacity:1}
.tile.keep{border-color:var(--keep);opacity:1}
.tile.mark{border-color:var(--mark);opacity:1}
.tile .tag{
  position:absolute;left:8px;bottom:8px;font:600 10.5px/1 inherit;
  padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.6);color:var(--on-solid);
  opacity:0;transition:opacity .12s
}
.tile:hover .tag,.tile.keep .tag,.tile.mark .tag{opacity:1}
.tile.keep .tag{background:var(--keep)}
.tile.mark .tag{background:var(--mark);color:var(--on-mark)}

/* 悬停时贴底浮出一条操作栏。
   两个按钮各占一半，整条有 34px 高 —— 之前那两个小药丸太小，
   而且要瞄着点；贴底整条既好点，也不会盖住画面中心。 */
.actions{
  position:absolute;left:0;right:0;bottom:0;height:34px;
  display:flex;opacity:0;pointer-events:none;
  transition:opacity .14s ease;
}
.tile:hover .actions,.tile.keep .actions,.tile.mark .actions{opacity:1;pointer-events:auto}
.actions button{
  flex:1;border:none;border-top:1px solid rgba(255,255,255,.14);
  background:rgba(10,12,15,.78);color:#dfe3e8;
  font:600 12px/1 inherit;letter-spacing:.02em;
  backdrop-filter:blur(8px);transition:background .12s,color .12s;
}
.actions button+button{border-left:1px solid rgba(255,255,255,.10)}
.actions button:hover{background:rgba(10,12,15,.92)}
.actions .aKeep:hover{color:var(--keep)}
.actions .aMark:hover{color:var(--mark)}
/* 已经标在这张上，对应那一半点亮 */
.tile.keep .aKeep{background:rgba(63,185,80,.22);color:var(--keep)}
.tile.mark .aMark{background:rgba(227,179,65,.20);color:var(--mark)}

/* 角标：圆形图标，不写字。和左侧列表里的 ✓ ✕ ★ 是同一套符号。 */
.flag{
  position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-size:13px;line-height:1;
  box-shadow:0 2px 10px rgba(0,0,0,.55);
}
.tile.keep .flag{display:flex;background:var(--keep);color:var(--on-solid)}
.tile.mark .flag{display:flex;background:var(--mark);color:var(--on-mark)}

/* ── 放大层 ── */
.zoom{
  position:fixed;inset:0;z-index:50;background:rgba(4,5,7,.95);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .18s ease,visibility 0s linear .18s;
}
.zoom.on{opacity:1;visibility:visible;transition:opacity .18s ease}
.zoomBox{
  width:min(78vw,900px);aspect-ratio:3/2;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font:600 88px/1 ui-monospace,Consolas,monospace;color:rgba(255,255,255,.9);
  box-shadow:0 30px 90px rgba(0,0,0,.8);transform:scale(.93);
  transition:transform .2s cubic-bezier(.2,.7,.3,1);
}
.zoom.on .zoomBox{transform:scale(1)}
.zoomHint{
  position:fixed;left:0;right:0;bottom:20px;text-align:center;
  font-size:11.5px;color:var(--ink3);
}

/* ── 底部提示条 ── */
.foot{
  position:absolute;left:0;right:0;bottom:0;height:56px;
  display:flex;align-items:center;gap:8px;padding:0 16px;
  border-top:1px solid var(--line);background:var(--surface);
  font-size:11.5px;color:var(--ink3);flex-wrap:wrap;
}
kbd{
  display:inline-block;min-width:20px;text-align:center;
  padding:2px 6px;margin:0 2px;border-radius:5px;
  background:var(--surface2);border:1px solid var(--line);
  font:600 11px ui-monospace,Consolas,monospace;color:var(--ink2);
}
.msg{margin-left:auto;color:var(--accent);font-weight:600}
</style>
</head>
<body>

<div class="top">
  <span class="brand">过片 · 原型</span>
  <div class="tabs">
    <button class="tab on" data-mode="single">单图模式</button>
    <button class="tab" data-mode="multi">多图模式</button>
  </div>
  <span class="sp"></span>
  <span class="hint" id="topHint"></span>
</div>

<!-- 单图 -->
<div id="single">
  <div class="cardWrap" id="cardWrap">
    <div class="card" id="card"></div>
  </div>
</div>

<!-- 多图 -->
<div id="multi" class="hidden">
  <div class="mHead">
    <span>一起决定 <b id="mCount">10</b> 张</span><span class="hint" id="mMarked">还没标</span>
    <span class="hint">点图片＝看 · 悬停后点按钮标记</span>
    <span class="sp"></span>
    <button class="tab" id="mCancel">取消 (Esc)</button>
    <button class="tab" id="mCommit">提交 (Enter)</button>
  </div>
  <div class="mBody" id="mBody"></div>
</div>

<!-- 放大 -->
<div class="zoom" id="zoom">
  <div class="zoomBox" id="zoomBox"></div>
  <div class="zoomHint" id="zoomHint"></div>
</div>

<div class="foot" id="foot"></div>

<script>
/* 用渐变块代替照片：这里练的是操作，不是看图。 */
const N = 10;
const TINTS = [
  ['#3a5a7a','#1a2430'], ['#5a4a3a','#241c16'], ['#3a5a46','#16241c'],
  ['#5a3a4a','#241620'], ['#4a4a5a','#1c1c26'], ['#5a5a3a','#24241a'],
  ['#3a4a5a','#161e26'], ['#5a3a3a','#241616'], ['#3a5a5a','#162426'],
  ['#4a3a5a','#1e1624'],
];
const photos = TINTS.map((t, i) => ({ id: i + 1, tint: t }));
const grad = (p) => `linear-gradient(155deg, ${p.tint[0]}, ${p.tint[1]})`;

const $ = (s) => document.querySelector(s);
const state = {
  mode: 'single',
  idx: 0,
  marks: new Map(),      // id -> 'keep' | 'mark'
  zoomId: null,
  zoomFrom: null,        // 'single' | 'multi'
};

/* ─────────────── 单图 ─────────────── */
const wrap = $('#cardWrap');
const card = $('#card');

function drawSingle() {
  const p = photos[state.idx];
  card.style.background = grad(p);
  card.textContent = '#' + p.id;
  wrap.style.transform = 'none';
  wrap.style.opacity = 1;
  const m = state.marks.get(p.id);
  card.querySelector('.badge')?.remove();
  if (m) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = m === 'mark' ? '★ 精选' : '✓ 留下';
    b.style.cssText = m === 'mark'
      ? 'background:var(--mark);color:var(--on-mark)'
      : 'background:var(--keep);color:var(--on-solid)';
    card.appendChild(b);
  }
}

function fly(kind, cb) {
  wrap.style.transform = kind === 'keep' ? 'translateX(70%) rotate(14deg)'
                        : kind === 'mark' ? 'translateY(-40%) scale(.94)'
                        : 'translateX(-70%) rotate(-14deg)';
  wrap.style.opacity = 0;
  setTimeout(() => {
    state.idx = Math.min(photos.length - 1, state.idx + 1);
    wrap.style.transition = 'none';
    drawSingle();
    requestAnimationFrame(() => { wrap.style.transition = ''; });
    cb && cb();
  }, 180);
}

function decideSingle(kind) {
  const p = photos[state.idx];
  state.marks.set(p.id, kind);
  fly(kind, () => flash(kind === 'keep' ? '留下 · 下一张' : kind === 'mark' ? '精选 · 下一张' : '不过 · 下一张'));
}

/* ─────────────── 多图 ─────────────── */
const mBody = $('#mBody');

function layout() {
  const r = mBody.getBoundingClientRect();
  const n = photos.length;
  const gap = 12;
  let rows = 2, cols, size;
  for (; rows <= 3; rows++) {
    cols = Math.ceil(n / rows);
    size = Math.floor(Math.min((r.width - gap * (cols - 1)) / cols,
                               (r.height - gap * (rows - 1)) / rows));
    if (size >= 150) break;
  }
  size = Math.max(96, size);
  mBody.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
  mBody.style.gridAutoRows = size + 'px';
}

function drawMulti() {
  mBody.innerHTML = '';
  photos.forEach((p) => {
    const m = state.marks.get(p.id);
    const t = document.createElement('div');
    t.className = 'tile ' + (m || 'unmarked');
    t.dataset.id = p.id;
    t.style.background = grad(p);
    t.innerHTML = `<span>#${p.id}</span>
      <span class="flag">${m === 'mark' ? '★' : '✓'}</span>
      <span class="actions">
        <button class="aKeep" data-act="keep">${m === 'keep' ? '取消留下' : '留下'}</button>
        <button class="aMark" data-act="mark">${m === 'mark' ? '取消精选' : '精选'}</button>
      </span>`;
    mBody.appendChild(t);
  });
  layout();
  updateMultiHead();
}

function updateMultiHead() {
  const kept = [...state.marks.values()].filter(Boolean).length;
  const marked = [...state.marks.values()].filter((v) => v === 'mark').length;
  // 头部只说事实：一共几张、已经标了几张。
  // 之前这里显示的是「还没标几张」，看着像总数，很容易误解。
  $('#mCount').textContent = photos.length;
  $('#mMarked').textContent = kept ? `已标 ${kept} 张${marked ? `（含精选 ${marked}）` : ''}` : '还没标';
  $('#mCommit').textContent = kept
    ? `留下 ${kept} 张，其余 ${photos.length - kept} 张不过`
    : `全部 ${photos.length} 张不过`;
}

mBody.addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  const id = +tile.dataset.id;
  const btn = e.target.closest('.actions button');
  if (btn) {
    const want = btn.dataset.act;
    const cur = state.marks.get(id);
    if (cur === want) state.marks.delete(id); else state.marks.set(id, want);
    drawMulti();
    return;
  }
  openZoom(id, 'multi');     // 点图片＝看，永远不改状态
});

/* ─────────────── 放大 ─────────────── */
function openZoom(id, from) {
  const p = photos.find((x) => x.id === id);
  state.zoomId = id; state.zoomFrom = from;
  const box = $('#zoomBox');
  box.style.background = grad(p);
  box.textContent = '#' + p.id;
  $('#zoomHint').innerHTML = from === 'multi'
    ? '<kbd>←</kbd><kbd>→</kbd> 同组内翻页 · <kbd>K</kbd> 留下 · <kbd>S</kbd> 精选 · <kbd>空格</kbd> / <kbd>Esc</kbd> 返回'
    : '<kbd>K</kbd> 留下 · <kbd>S</kbd> 精选 · <kbd>空格</kbd> / <kbd>Esc</kbd> 返回';
  $('#zoom').classList.add('on');
}
function closeZoom() {
  $('#zoom').classList.remove('on');
  state.zoomId = null;
  if (state.zoomFrom === 'multi') drawMulti();
}
$('#zoom').onclick = () => closeZoom();

/* ─────────────── 键盘 ─────────────── */
function flash(t) {
  const el = $('#msg') || (() => {
    const d = document.createElement('span'); d.id = 'msg'; d.className = 'msg';
    $('#foot').appendChild(d); return d;
  })();
  el.textContent = t;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { el.textContent = ''; }, 1800);
}

addEventListener('keydown', (e) => {
  const k = e.key;

  // 放大层优先
  if ($('#zoom').classList.contains('on')) {
    if (k === ' ' || k === 'Escape') { e.preventDefault(); closeZoom(); return; }
    if (state.zoomId != null) {
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        e.preventDefault();
        const i = photos.findIndex((p) => p.id === state.zoomId);
        const j = Math.max(0, Math.min(photos.length - 1, i + (k === 'ArrowLeft' ? -1 : 1)));
        state.zoomId = photos[j].id;
        const box = $('#zoomBox');
        box.style.background = grad(photos[j]); box.textContent = '#' + photos[j].id;
      }
      if (k === 'k' || k === 'K') { state.marks.set(state.zoomId, 'keep'); flash('✓ 留下'); }
      if (k === 's' || k === 'S') { state.marks.set(state.zoomId, 'mark'); flash('★ 精选'); }
    }
    return;
  }

  if (state.mode === 'single') {
    if (k === 'ArrowRight' || k === 'k' || k === 'K') { e.preventDefault(); decideSingle('keep'); }
    else if (k === 'ArrowLeft' || k === 'j' || k === 'J') { e.preventDefault(); decideSingle('reject'); }
    else if (k === ' ') { e.preventDefault(); decideSingle('mark'); }
    else if (k === 'ArrowDown') { e.preventDefault(); state.idx = Math.min(photos.length-1, state.idx+1); drawSingle(); }
    else if (k === 'ArrowUp') { e.preventDefault(); state.idx = Math.max(0, state.idx-1); drawSingle(); }
    else if (k === 'z' || k === 'Z') { e.preventDefault(); openZoom(photos[state.idx].id, 'single'); }
    return;
  }

  // 多图
  if (k === 'Escape') { e.preventDefault(); setMode('single'); flash('已退出多图模式'); return; }
  if (k === 'Enter') {
    e.preventDefault();
    const kept = [...state.marks.values()].filter(Boolean).length;
    flash(kept ? `已提交：留 ${kept} 张，其余 ${photos.length-kept} 张不过` : `已提交：${photos.length} 张全部不过`);
    setMode('single');
    return;
  }
  // 多图里不做键盘决定：点图片是看，按钮是标。
  // 只有 Enter / Esc 这两个收尾动作保留。
});

/* 拖拽（单图） */
let drag = null;
card.addEventListener('pointerdown', (e) => {
  if (state.mode !== 'single') return;
  drag = { x: e.clientX, y: e.clientY };
  wrap.style.transition = 'none';
});
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  wrap.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx*0.03}deg)`;
});
addEventListener('pointerup', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  drag = null;
  wrap.style.transition = '';
  if (Math.abs(dx) > 90) decideSingle(dx > 0 ? 'keep' : 'reject');
  else { wrap.style.transform = 'none'; }
});

/* ─────────────── 模式切换 ─────────────── */
function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.tab[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
  $('#single').classList.toggle('hidden', m !== 'single');
  $('#multi').classList.toggle('hidden', m !== 'multi');
  if (m === 'multi') drawMulti(); else drawSingle();
  drawHelp();
}
document.querySelectorAll('.tab[data-mode]').forEach((b) => { b.onclick = () => setMode(b.dataset.mode); });
$('#mCancel').onclick = () => { setMode('single'); flash('已取消，什么都没改'); };
$('#mCommit').onclick = () => { $('#mCommit').click(); };

function drawHelp() {
  $('#foot').innerHTML = state.mode === 'single'
    ? `<kbd>←</kbd> 不过 <kbd>→</kbd> 要 <kbd>空格</kbd> 精选 <kbd>↑</kbd><kbd>↓</kbd> 翻看 <kbd>Z</kbd> 放大 · 也可以直接拖卡片`
    : `<span>点图片＝<b>放大看</b></span><span>·</span><span>鼠标移上去，点 <b>留下</b> 或 <b>精选</b></span><span>·</span><span>没点过的就不过</span>`;
  $('#topHint').textContent = state.mode === 'single' ? '一张一张过' : '一组一起看';
}

// #multi 直接进多图，#hover 顺便把按钮显示出来（方便截图看样式）
if (location.hash.includes('multi')) setMode('multi');
else { drawSingle(); drawHelp(); }
if (location.hash.includes('hover')) {
  document.querySelectorAll('.tile').forEach((t, i) => {
    if (i < 3) t.querySelector('.actions').style.cssText = 'opacity:1;pointer-events:auto';
  });
}
</script>
</body>
</html>
